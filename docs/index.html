<script>
// Point Download straight at the latest release's APK; the release page stays as the fallback.
fetch('https://api.github.com/repos/luke255/seidr/releases/latest')
  .then(function (r) { return r.json(); })
  .then(function (r) {
    var apk = (r.assets || []).filter(function (a) { return /\.apk$/.test(a.name); })[0];
    if (apk) document.getElementById('apk').href = apk.browser_download_url;
  })
  .catch(function () {});
</script>
