# Unit tests and lint on every push (the same as scripts/hooks/pre-push),
# plus a debug build, the only check that compiles the native code
# (projectM, OpenXR). LiveServerTest skips itself here. Release signing stays
# off CI on purpose: self-update trusts whatever that key signs.
# Actions are pinned to commit SHAs; Dependabot keeps them current.
# Gradle caching is setup-java's (open source), not gradle/actions/setup-gradle.
name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      # Checks gradle-wrapper.jar is a genuine Gradle release. Not setup-gradle:
      # from v6 its caching is closed source under Gradle's terms; setup-java
      # caches instead. This action is MIT and doesn't load that component.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Unit tests and lint
        run: ./gradlew --console=plain :app:testDebugUnitTest :app:lintDebug
      - name: Reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: NDK and CMake
        # Keep in step with ndkVersion and cmake version in app/build.gradle.kts.
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.16248370" "cmake;4.1.2" > /dev/null
      - name: Debug build
        run: ./gradlew --console=plain :app:assembleDebug
